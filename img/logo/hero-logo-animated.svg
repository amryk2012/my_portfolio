<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 620" role="img" aria-label="Unity cube and game controller logo" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a5cff"/>
      <stop offset="1" stop-color="#19d3ff"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#19d3ff"/>
      <stop offset="1" stop-color="#2a7dff"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe0ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#7fa8ff" stop-opacity=".12"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <style>
    .orbit  { transform-box: view-box; transform-origin: 400px 290px;
              animation: spin 14s linear infinite; }
    .orbit-glow { animation: pulse 3s ease-in-out infinite; }
    .core   { animation: float 5s ease-in-out infinite; }
    .px     { animation: twinkle 2.6s ease-in-out infinite; }
    .px:nth-child(2) { animation-delay: .3s }
    .px:nth-child(3) { animation-delay: .7s }
    .px:nth-child(4) { animation-delay: 1.1s }
    .px:nth-child(5) { animation-delay: 1.5s }
    .px:nth-child(6) { animation-delay: 1.9s }
    .px:nth-child(7) { animation-delay: .5s }
    .floor  { animation: pulse 3s ease-in-out infinite; }
    @keyframes spin    { to { transform: rotate(360deg); } }
    @keyframes pulse   { 0%,100% { opacity: .75 } 50% { opacity: 1 } }
    @keyframes float   { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
    @keyframes twinkle { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
    @media (prefers-reduced-motion: reduce) {
      .orbit, .orbit-glow, .core, .px, .floor { animation: none; }
    }
  </style>

  <!-- floor glow -->
  <ellipse class="floor" cx="415" cy="590" rx="330" ry="8" fill="#1a8cff" opacity=".85" filter="url(#blur)"/>

  <!-- cube + controller -->
  <g class="core">
    <path d="M190 430C200 330 260 290 330 300L560 300C620 290 680 330 695 480C700 560 680 570 650 540C600 480 560 440 470 440L370 440C310 440 250 500 210 550C185 570 180 520 190 430Z"
          fill="url(#body)" stroke="#a9c6ff" stroke-opacity=".5" stroke-width="2"/>
    <path d="M375 432H520C570 432 600 520 690 552" fill="none" stroke="#2a7dff" stroke-width="6" stroke-linecap="round"/>
    <path d="M212 550L300 480H460" fill="none" stroke="#4a9dff" stroke-width="6" stroke-linecap="round"/>
    <path d="M233 350h24v22h22v26h-22v22h-24v-22h-22v-26h22z" fill="#e6efff" fill-opacity=".55" stroke="#a9c6ff" stroke-opacity=".6"/>
    <g fill="#e6efff" fill-opacity=".35" stroke="#a9c6ff" stroke-opacity=".6" stroke-width="2">
      <circle cx="582" cy="335" r="17"/><circle cx="552" cy="372" r="17"/>
      <circle cx="614" cy="372" r="17"/><circle cx="582" cy="402" r="17"/>
    </g>
    <g fill="#cfe0ff" fill-opacity=".14" stroke="#b8d0ff" stroke-opacity=".7" stroke-width="3" stroke-linejoin="round">
      <polygon points="390,80 498,142 498,268 390,330 282,268 282,142"/>
      <polyline points="282,142 390,205 498,142" fill="none"/>
      <line x1="390" y1="205" x2="390" y2="330"/>
    </g>
  </g>

  <!-- rotating orbit -->
  <g class="orbit"><g class="orbit-glow" filter="url(#glow)">
    <path d="M178 300C185 130 370 5 592 108C400 40 215 120 178 300Z" fill="url(#g1)"/>
    <path d="M25 395C80 470 300 470 520 350C640 310 760 240 785 150C740 230 650 280 520 330C300 430 90 440 25 395Z" fill="url(#g2)"/>
    <path d="M152 268C70 310 15 360 28 405C40 350 90 300 152 268Z" fill="url(#g1)"/>
  </g></g>

  <!-- pixel squares -->
  <g>
    <rect class="px" x="640" y="35"  width="26" height="26" fill="#1a7dff"/>
    <rect class="px" x="711" y="68"  width="40" height="40" fill="#3b8bff"/>
    <rect class="px" x="607" y="64"  width="32" height="32" fill="#1a7dff"/>
    <rect class="px" x="573" y="145" width="22" height="22" fill="#3b8bff"/>
    <rect class="px" x="607" y="113" width="32" height="32" fill="#2a7dff"/>
    <rect class="px" x="663" y="111" width="46" height="46" fill="#1a6dff"/>
    <rect class="px" x="632" y="173" width="28" height="28" fill="#4a9dff"/>
    <rect class="px" x="664" y="205" width="18" height="18" fill="#2a7dff"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
